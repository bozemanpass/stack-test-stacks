name: test
description: "A test stack"
# Deliberate legacy coverage: repos: is deprecated (the clone set is derived from
# container refs), but this stack keeps one entry so the smoke test still exercises
# the "throw in an extra repo" path -- including its @branch handling -- until the
# feature is removed.  `stack validate` warning about it here is expected.
repos:
  - github.com/bozemanpass/stack-test-project@test-branch
containers:
  - name: bozemanpass/test-container
  # Note: the ref (repo) and path (within the repo) are inferred because we use standard naming conventions in this repo
pods:
  - test

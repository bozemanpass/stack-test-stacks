name: test-database-stack
description: "A test database stack"
repos:
containers:
  - bozemanpass/test-database-container
  - bozemanpass/test-database-client
pods:
  - test-database
# The database password is a declared secret: generated at deploy time, delivered to
# every container of the deployment (the database and its client both need it), and
# never written into the stack files, the spec, or the deployment artifacts.
secrets:
  POSTGRES_PASSWORD:

services:

  # Holds the data we back up and restore. Keeps /data (the app-data volume) mounted and
  # the container alive (it runs nginx forever).
  #
  # app-data2 is the fixture for the backup-exclude annotation: it is written like any
  # other volume and must not appear in a backup. It lives here, in the application
  # stack, rather than on some other service, so that the exclusion is exercised on every
  # deployment target -- on Kubernetes it becomes the k8up.io/backup=false annotation on
  # the volume's PVC, which is a different mechanism than the Docker target's and is
  # worth testing.
  # The backup-command annotation is the fixture for application-consistent dumps: at
  # backup time the command runs inside this container and its stdout is captured into
  # the backup as a snapshot of its own. cat of the payload file stands in for a real
  # database dump; the test asserts the captured output matches what it wrote.
  app:
    image: bozemanpass/test-container:stack
    restart: always
    volumes:
      - app-data:/data
      - app-data2:/data2   # @stack backup-exclude
    # @stack backup-command cat /data/payload.txt
    # @stack backup-file-extension txt

volumes:
  app-data:
  app-data2:

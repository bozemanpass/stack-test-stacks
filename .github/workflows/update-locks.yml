name: Update Locks

# Regenerate the lock pins of every stack in this repo at current upstream
# state -- wrapper and source-repo commits, and external image digests --
# validate them by building, then commit and push.  This is the only
# sanctioned way lock updates happen: delete and regenerate, never hand-edit.
#
# Publishing happens inline (before the push) because pushes made with the
# default GITHUB_TOKEN do not trigger other workflows, so the on-push publish
# workflow would not fire for the lock commit.  Only the stacks named in
# PUBLISH_STACKS publish -- the same set as publish-images.yml.

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Only update this stack (directory name under stack-files/stacks); default: all"
        required: false
        default: ""
  # Uncomment to also ingest upstream changes on a schedule:
  # schedule:
  #   - cron: '0 9 * * 1'

concurrency: update-locks

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      STACKS_ROOT: stack-files/stacks
      PUBLISH_STACKS: test-static-content-stack
      ONLY_STACK: ${{ inputs.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stack
        run: |
          mkdir -p $HOME/bin
          curl -L -o $HOME/bin/stack https://github.com/bozemanpass/stack/releases/latest/download/stack
          chmod +x $HOME/bin/stack
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Log in to container image registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate locks (each build validates its stack's new pins)
        run: |
          for stack_dir in $STACKS_ROOT/*/; do
            name=$(basename "$stack_dir")
            if [ -n "$ONLY_STACK" ] && [ "$name" != "$ONLY_STACK" ]; then
              continue
            fi
            echo "=== $name"
            rm -f "$stack_dir/stack.lock"
            stack prepare --stack "./$stack_dir"
          done

      - name: Commit, publish and push if any locks changed
        run: |
          if [ -z "$(git status --porcelain "$STACKS_ROOT")" ]; then
            echo "Locks unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STACKS_ROOT"/*/stack.lock
          git commit -m "Update stack locks"
          for name in $PUBLISH_STACKS; do
            stack prepare --stack "./$STACKS_ROOT/$name" --publish-images --image-registry ghcr.io
          done
          git push
